version: '3.8'

services:
  app:
    build: .
    container_name: sih26108_app
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=sih_password
      - LOG_LEVEL=INFO
    depends_on:
      - neo4j
    restart: unless-stopped

  neo4j:
    image: neo4j:5.18-community
    container_name: sih26108_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/sih_password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  neo4j_data:
